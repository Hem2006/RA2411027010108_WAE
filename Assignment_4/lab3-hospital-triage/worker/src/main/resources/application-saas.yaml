# Camunda 8 SaaS. Create an API client in Console (Cluster > API > Create client, scopes Zeebe + Orchestration)
# and export its values as environment variables before starting the app. Never commit real secrets.
camunda:
  client:
    mode: saas
    auth:
      client-id: ${CAMUNDA_CLIENT_ID}
      client-secret: ${CAMUNDA_CLIENT_SECRET}
    cloud:
      cluster-id: ${CAMUNDA_CLUSTER_ID}
      region: ${CAMUNDA_CLUSTER_REGION}

server:
  port: 8081

spring:
  application:
    name: lab1-loan-approval

# Default profile: local Camunda 8 Run (no Docker) on this machine.
# For Camunda 8 SaaS start with --spring.profiles.active=saas (see application-saas.yaml).
camunda:
  client:
    mode: self-managed
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8080
    auth:
      method: none

lab:
  deploy:
    # Deploys every .bpmn/.dmn/.form file from models-dir on startup.
    enabled: true
    models-dir: ../models
  mock:
    # Delay used by the mock credit API when simulating a timeout (connector read timeout is 10 s).
    timeout-delay-ms: 15000
